<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student CGPA Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Student CGPA Calculator</h2>
        <button class="dark-toggle" onclick="toggleDark()">Dark</button>
    </div>

    <div class="tab-bar">
        <button class="tab active" onclick="switchTab('calculator')">Calculator</button>
        <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <div id="calculator" class="tab-content active">

        <div class="section-title">Student Details</div>
        <div class="student-info">
            <div class="info-grid">
                <div class="field">
                    <label>Student Name</label>
                    <input type="text" id="stu_name" placeholder="Enter full name">
                </div>
                <div class="field">
                    <label>Register Number</label>
                    <input type="text" id="stu_reg" placeholder="Enter register number">
                </div>
                <div class="field">
                    <label>College Name</label>
                    <input type="text" id="stu_college" placeholder="Enter college name">
                </div>
                <div class="field">
                    <label>Department / Course</label>
                    <input type="text" id="stu_dept" placeholder="B.E. Computer Science and Engineering">
                </div>
                <div class="field">
                    <label>Academic Year</label>
                    <select id="stu_ayear">
                        <option value="">Select Year</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>
                <div class="field">
                    <label>Semester</label>
                    <select id="stu_sem">
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-title">Subject Details</div>
        <div class="table-wrapper">
            <table id="subject-table">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Paper Code</th>
                        <th>Subject Name</th>
                        <th>Credits</th>
                        <th>Grade Point</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="subject-body">
                </tbody>
            </table>
        </div>
        <button class="calc-btn add-btn" onclick="addSubject()">+ Add Subject</button>

        <div class="result-section" id="result"></div>

        <div class="btn-row">
            <button class="calc-btn" onclick="calculateSGPA()">Calculate SGPA</button>
            <button class="calc-btn save-btn" onclick="saveSemester()">Save Semester</button>
        </div>

        <div class="section-title">Saved Semesters</div>
        <div id="saved-sems"></div>

        <div class="btn-row">
            <button class="calc-btn" onclick="calculateCGPA()">Calculate Final CGPA</button>
            <button class="calc-btn print-btn" onclick="printResult()">Print / Download</button>
        </div>

        <div id="final-result"></div>
    </div>

    <div id="history" class="tab-content">
        <div id="history-list"></div>
        <button class="calc-btn danger-btn" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
